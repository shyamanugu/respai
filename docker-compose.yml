# Local all-up for the APIX suite + LLMOps ops console. One .env drives everything;
# a shared ./data volume is the trace/feedback sink the ops console reads.
#
#   cp .env.example .env   # fill in Azure creds
#   docker compose up --build            # long-running services
#   docker compose --profile jobs run --rm pipeline --mode telesales --date 2025-08-28
#
# All images build from the repo root (context: .) so platform/ is included.
services:
  dashboard-api:
    build: { context: ., dockerfile: usecases/apix/application/Dockerfile }
    env_file: .env
    environment:
      - PORT=8000
      - LLMOPS_TRACE_FILE=/data/traces/trace.jsonl
      - APIX_FEEDBACK_PATH=/data/feedback/feedback.jsonl
      - APIX_SPA_ORIGINS=http://localhost:5173
      - APIX_COOKIE_SECURE=false
    ports: ["8000:8000"]
    volumes: ["./data:/data"]

  dashboard-web:
    build:
      context: .
      dockerfile: usecases/apix/application/web/Dockerfile
      args:
        VITE_DASHBOARD_API_URL: ""            # same-origin (nginx proxies /api)
        VITE_CHAT_API_URL: "http://localhost:8001"
    environment:
      - DASHBOARD_API_UPSTREAM=http://dashboard-api:8000
    ports: ["5173:80"]
    depends_on: [dashboard-api]

  chatbot:
    build: { context: ., dockerfile: usecases/apix/chatbot/Dockerfile }
    env_file: .env
    environment:
      - PORT=8000
      - LLMOPS_TRACE_FILE=/data/traces/trace.jsonl
    ports: ["8001:8000"]
    volumes: ["./data:/data"]

  ops-backend:
    build: { context: ., dockerfile: ops-console/backend/Dockerfile }
    env_file: .env
    environment:
      - PORT=8100
      - LLMOPS_TRACE_FILE=/data/traces/trace.jsonl
      - APIX_FEEDBACK_PATH=/data/feedback/feedback.jsonl
      - APIX_EVAL_HISTORY_PATH=/data/eval/eval_runs.jsonl
      - OPS_DB_PATH=/data/ops/ops.db
      - OPS_CORS_ORIGINS=http://localhost:8080
    ports: ["8100:8100"]
    volumes: ["./data:/data"]

  ops-web:
    build:
      context: .
      dockerfile: ops-console/web/Dockerfile
      args:
        VITE_OPS_API_URL: ""                  # same-origin (nginx proxies /ops)
    environment:
      - OPS_API_UPSTREAM=http://ops-backend:8100
    ports: ["8080:80"]
    depends_on: [ops-backend]

  # ── Jobs (run on demand: docker compose --profile jobs run --rm <svc> ...) ──
  pipeline:
    build: { context: ., dockerfile: usecases/apix/ai_pipeline/Dockerfile }
    env_file: .env
    environment:
      - LLMOPS_TRACE_FILE=/data/traces/trace.jsonl
      - APIX_FEEDBACK_PATH=/data/feedback/feedback.jsonl
    volumes: ["./data:/data"]
    profiles: ["jobs"]

  chatbot-ingest:
    build: { context: ., dockerfile: usecases/apix/chatbot/Dockerfile }
    env_file: .env
    command: ["python", "-m", "chatbot.ingestion"]
    volumes: ["./data:/data"]
    profiles: ["jobs"]
