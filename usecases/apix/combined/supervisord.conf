; Runs the 4 processes that make up the combined APIX container: three
; independent Python apps (each in its OWN venv — see combined/README.md for
; why) plus nginx routing between them. supervisord is PID 1 (`-n`), so if any
; program dies it restarts automatically and the container itself only exits
; if supervisord itself does.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:dashboard-api]
directory=/app/application
command=/opt/venv-dashboard/bin/uvicorn api.main:app --host 127.0.0.1 --port 8001
environment=LLMOPS_PLATFORM_ROOT="/app/platform"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chatbot]
directory=/app/chatbot
command=/opt/venv-chatbot/bin/uvicorn main:app --host 127.0.0.1 --port 8002
environment=LLMOPS_PLATFORM_ROOT="/app/platform"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pipeline-api]
directory=/app/ai_pipeline
command=/opt/venv-pipeline/bin/uvicorn api.main:app --host 127.0.0.1 --port 8003
environment=LLMOPS_PLATFORM_ROOT="/app/platform"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
