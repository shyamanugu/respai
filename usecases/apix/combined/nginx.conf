# Single entry point (port 8080) routing to the 3 internal apps by path, plus
# serving the built dashboard React SPA directly. Same-origin for everything —
# no CORS, no cross-origin cookie concerns for the dashboard's session cookie.
server {
    listen 8080;
    server_name _;

    # Dashboard API. Its own routes are already registered under /api/... (see
    # usecases/apix/application/api/main.py), so the prefix is PRESERVED when
    # forwarded (proxy_pass has no trailing path component).
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Chatbot. Its routes are bare (/chat_agent, /sessions/..., /health) so the
    # /chatbot/ prefix is STRIPPED when forwarded (proxy_pass ends in /).
    location /chatbot/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pipeline trigger API. Same prefix-stripping as chatbot. Every mutating
    # route there requires a bearer token (PIPELINE_TRIGGER_TOKEN) — see
    # ai_pipeline/api/main.py — so exposing this externally is intentional,
    # not an oversight.
    location /pipeline/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cheap container-level liveness check (does not verify the 3 upstreams
    # individually — use /api/health, /chatbot/health, /pipeline/health for that).
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The built dashboard SPA, served directly (no proxy needed for static files).
    location / {
        root /app/application/web/dist;
        try_files $uri $uri/ /index.html;
    }
}
